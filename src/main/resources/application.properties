quarkus.application.name=agentic-operations
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=agentic-operations REST API
quarkus.smallrye-openapi.info-version=1.0.0
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://agentic-operations-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearer
quarkus.smallrye-openapi.auto-add-security-requirement=false
# Allow Developer Hub's API Definition tester to call this service directly. The API has no PUT/PATCH/DELETE.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST
quarkus.http.cors.headers=Accept,Authorization,Content-Type,traceparent
quarkus.http.cors.access-control-allow-credentials=false

# ---------------------------------------------------------------------------------------------------------------
# Inbound identity (box1-docs#20 D-005). Realm box1, audience agentic-operations, roles from this client's claim only.
# OIDC is a service (bearer) application; it never logs users in.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
quarkus.oidc.client-id=agentic-operations
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=agentic-operations
quarkus.oidc.roles.role-claim-path=resource_access/agentic-operations/roles
quarkus.oidc.resource-metadata.enabled=true
# Local JWT verification only: a token that fails is rejected, never sent to Keycloak introspection.
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
# OidcProvider logs the raw bearer token at WARN when verification fails; keep tokens out of logs.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
quarkus.keycloak.devservices.enabled=false
aiops.auth.allowed-azp=${AIOPS_ALLOWED_AZP:agentic-operations-cli}
aiops.auth.require-jwt=true
# Both the REST API and the MCP endpoint need a caller with an aiops role at the HTTP layer (review S-4); roles and
# the accepted client are checked again in the service layer.
quarkus.http.auth.permission.aiops.paths=/api/v1/ai/*,/mcp,/mcp/*
quarkus.http.auth.permission.aiops.policy=aiops-role
quarkus.http.auth.policy.aiops-role.roles-allowed=aiops-viewer,aiops-analyst

# ---------------------------------------------------------------------------------------------------------------
# MCP (D-004): Streamable HTTP at /mcp, tools only.
quarkus.mcp.server.server-info.name=agentic-operations
quarkus.mcp.server.http.root-path=/mcp

# ---------------------------------------------------------------------------------------------------------------
# Read-only evidence sources (D-006). In-cluster Services only.
aiops.upstream.order-url=${ORDER_SERVICE_URL:http://order-service.order-service-dev.svc:8080}
aiops.upstream.inventory-url=${INVENTORY_SERVICE_URL:http://inventory-service.inventory-service-dev.svc:8080}
aiops.upstream.fulfillment-url=${FULFILLMENT_ADAPTER_URL:http://fulfillment-adapter.fulfillment-adapter-dev.svc:8080}

# Model (D-008). In-cluster vLLM; never the public route.
aiops.model.base-url=${VLLM_BASE_URL:http://vllm-test-2.vllm.svc:8000/v1}
aiops.model.id=${MODEL_ID:box1-coder}
aiops.model.timeout=${MODEL_TIMEOUT:120s}
aiops.model.context-profile=${AIOPS_CONTEXT_PROFILE:32k}
# Platform evidence (box1-docs#111). Unset means that source stays UNAVAILABLE ("not configured").
aiops.platform.token-path=${AIOPS_PLATFORM_TOKEN_PATH:}
aiops.platform.ca-path=${AIOPS_PLATFORM_CA_PATH:}
aiops.platform.tempo-url=${AIOPS_TEMPO_URL:}
aiops.platform.loki-url=${AIOPS_LOKI_URL:}
aiops.platform.thanos-tenancy-url=${AIOPS_THANOS_TENANCY_URL:}
aiops.platform.alertmanager-tenancy-url=${AIOPS_ALERTMANAGER_TENANCY_URL:}
aiops.platform.order-namespaces=${AIOPS_PLATFORM_ORDER_NAMESPACES:order-service-dev,inventory-service-dev,fulfillment-adapter-dev}

# ---------------------------------------------------------------------------------------------------------------
# Kafka evidence window (D-007). Read-only: no commits, no DLQ writes, no producing, not part of readiness.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
quarkus.kafka.health.enabled=false
mp.messaging.incoming.evidence-events.connector=smallrye-kafka
mp.messaging.incoming.evidence-events.topics=box1.order.events.v1,box1.inventory.events.v1,box1.fulfillment.events.v1,box1.telemetry.events.v1,box1.notification.events.v1
# One consumer per group: the window is per pod, so the Deployment runs one replica with Recreate (review M-2, R-4).
# Each environment sets its own declared group.
mp.messaging.incoming.evidence-events.group.id=${AIOPS_CONSUMER_GROUP:agentic-operations}
mp.messaging.incoming.evidence-events.enable.auto.commit=false
mp.messaging.incoming.evidence-events.commit-strategy=ignore
mp.messaging.incoming.evidence-events.failure-strategy=ignore
mp.messaging.incoming.evidence-events.auto.offset.reset=latest
mp.messaging.incoming.evidence-events.consumer-rebalance-listener.name=aiops-window-start
mp.messaging.incoming.evidence-events.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.evidence-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.evidence-events.health-enabled=false
mp.messaging.incoming.evidence-events.tracing-enabled=false
quarkus.micrometer.binder.kafka.enabled=true

# ---------------------------------------------------------------------------------------------------------------
# Observability (D-012).
quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://box1-collector.box1-observability.svc:4317}
# Langfuse (AI tracing): AI spans also go to Langfuse over OTLP/HTTP when both keys are set; otherwise nothing is
# sent there. Content (prompts, evidence, completions, questions, answers) is recorded on AI spans only when
# capture-content is true, which defaults to "a Langfuse key is set". Those spans also reach the collector above.
aiops.langfuse.base-url=${LANGFUSE_BASE_URL:https://langfuse.apps.ocp.box1.org}
aiops.langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
aiops.langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
aiops.langfuse.environment=${LANGFUSE_TRACING_ENVIRONMENT:default}
aiops.tracing.capture-content=${AIOPS_TRACE_CONTENT:}
%dev.aiops.langfuse.environment=${LANGFUSE_TRACING_ENVIRONMENT:development}
%test.aiops.langfuse.environment=${LANGFUSE_TRACING_ENVIRONMENT:test}
quarkus.micrometer.binder.http-server.match-patterns=/api/v1/ai/incidents/[^/]+/analyze=/api/v1/ai/incidents/{id}/analyze,/api/v1/ai/analyses/[^/]+=/api/v1/ai/analyses/{id},/api/v1/ai/conversations/[^/]+/messages=/api/v1/ai/conversations/{id}/messages,/api/v1/ai/conversations/[^/]+=/api/v1/ai/conversations/{id}

# ---------------------------------------------------------------------------------------------------------------
# Tests: no Keycloak, Kafka or collector. The window channel uses the in-memory connector; security comes from
# @TestSecurity. require-jwt is off only here, so non-JWT test identities pass; JWT identities still need an allowed azp.
%test.quarkus.oidc.tenant-enabled=false
%test.aiops.auth.require-jwt=false
%test.mp.messaging.incoming.evidence-events.connector=smallrye-in-memory
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.log.console.json.enabled=false
%dev.quarkus.log.console.json.enabled=false
%test.aiops.model.timeout=2s
